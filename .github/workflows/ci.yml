name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYYAML_VERSION: "6.0.3"
  # The pytest jarvis pins (requirements-dev.txt there).
  PYTEST_VERSION: "9.2.0"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ci/check-versions diffs against the base and reads the app tags.
          fetch-depth: 0
          persist-credentials: false

      # Every top-level folder but ci/ against the app rules of the pinned jarvis release
      # (platform/optional/app-hosting/CONTRACT.md there). Renovate offers each new release.
      - name: App-file check over every app folder
        uses: gordoncooper/jarvis/.github/actions/app-check@1d8997906bd236c61fd1f34a908939fbe3f6aa9d

      - name: Each app has a VERSION, bumped when a tagged app changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "${BASE_REF}" ]]; then
            python3 ci/check-versions "origin/${BASE_REF}"
          else
            python3 ci/check-versions
          fi

      - name: This repository's own tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q "PyYAML==${PYYAML_VERSION}" "pytest==${PYTEST_VERSION}"
          .venv/bin/pytest -ra ci
